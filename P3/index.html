<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INVASIÓN</title>

<link rel="icon" sizes="180x180" href="alien.ico">
<link rel="stylesheet" href="style.css">

<script src="invasion.js" defer></script>

</head>

<body>

<h2 class="game-title">INVASION ALIENIGENA</h2>

<div id="game-container">

    <div id="ui-layer">
        <div id="puntos">PUNTOS: 0</div>

        <div id="vivas-display">VIDAS: ❤️❤️❤️</div>

        <div id="energy-container">
            <span>ENERGIA:</span>
            <div id="energy-bar">
                <div id="energy-fill"></div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="modos">
        <button id="single-level">INICIAR MISION</button>
    </div>

    <div id="game-over" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">GAME OVER</h2>
            <button id="restart-button">NUEVA PARTIDA</button>
        </div>
    </div>

</div>

<div id="controls">

<p>CONTROLES: ⬅️ ➡️ ▬ SPACE para disparar</p>

<div class="game-controls">
<button id="btn-left">◀️</button>
<button id="btn-shoot">💥</button>
<button id="btn-right">▶️</button>
</div>

</div>

</body>
</html>
