<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="shortcut icon" href="paquita_ico.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡BOOM!</title>

    <!-- Hoja de estilo -->
    <link rel="stylesheet" href="css.css">

    <!-- Java Script -->
    <script src="crono.js" defer></script>

    <!-- favicon -->
    <link rel="icon" href="bomba.ico">

</head>

<body>
    <h1>💣 B O O M 💣</h1>

    <div id="pantalla">
        <div id="adivina">
            <!-- Clave secreta -->
            <div id="clave">
                <div class="casilla">
                    <p id="casilla1">*</p>
                </div>
                <div class="casilla">
                    <p id="casilla2">*</p>
                </div>
                <div class="casilla">
                    <p id="casilla3">*</p>
                </div>
                <div class="casilla">
                    <p id="casilla4">*</p>
                </div>
            </div>

            <!-- Intentos restantes -->
            <div>
                <h2 id="texto_intentos" style="display: inline;">Intentos restantes: </h2>
                <span id="intentos">7</span>
            </div>

            <!-- Cronómetro -->
            <div>
                <span id="contador">00:00:00</span>
            </div>

            <!-- info -->
            <div>
                <h3 id="info">💣 Nueva partida comenzada ¡Suerte para desactivar la bomba! 💣</h3>
            </div>

        </div>

        <div id="numeros">
            <!-- Botones numéricos -->
            <div id="teclado">
                <button id="btn0">0</button>
                <button id="btn1">1</button>
                <button id="btn2">2</button>
                <button id="btn3">3</button>
                <button id="btn4">4</button>
                <button id="btn5">5</button>
                <button id="btn6">6</button>
                <button id="btn7">7</button>
                <button id="btn8">8</button>
                <button id="btn9">9</button>
            </div>

            <!-- Controles -->
            <div>
                <button id="start">Start</button>
                <button id="stop">Stop</button>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>

</body>

</html>
